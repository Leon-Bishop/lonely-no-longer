services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lonely_no_longer
      POSTGRES_USER: lnl
      POSTGRES_PASSWORD: local_dev_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnl -d lonely_no_longer"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
